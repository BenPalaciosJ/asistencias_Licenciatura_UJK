<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistencia - Licenciaturas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Importar una fuente elegante y moderna de Google Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-zinc-950 flex items-center justify-center min-h-screen text-zinc-100">

    <div class="bg-zinc-900/80 backdrop-blur-sm p-14 rounded-3xl shadow-2xl max-w-4xl w-full mx-6 border border-zinc-800/50 flex flex-col items-center text-center">
        
        <!-- Encabezado Elegante -->
        <h1 class="text-3xl font-light text-zinc-300 mb-2 tracking-[0.2em] uppercase">Registro de Asistencia</h1>
        <h2 id="courseName" class="text-lg text-zinc-500 font-light mb-14 h-8 tracking-wide">Iniciando sistema...</h2>

        <div class="flex flex-col md:flex-row items-center justify-center gap-20 w-full">
            
            <!-- Sección del Código QR -->
            <div class="flex flex-col items-center">
                <p class="text-zinc-500 text-xs tracking-[0.3em] uppercase mb-6">1. Escanea para acceder</p>
                <div class="p-4 bg-white rounded-2xl shadow-lg ring-1 ring-white/10 transition-transform duration-500 hover:scale-105">
                    <img id="qrCode" 
                         src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=1&data=https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=GLuMkMtiv0qNgXNUIBnVib19QUgiNrVPvnvirf5lPohUNTRCUzJHS0IyRzZQV01TRkZWTEtBWkk4Mi4u" 
                         alt="QR del Formulario" 
                         class="w-56 h-56 object-contain rounded-xl">
                </div>
                <p class="text-xs text-zinc-600 mt-6 font-light max-w-[200px]">Usa tu cuenta institucional.</p>
            </div>

            <!-- Sección del PIN -->
            <div class="flex flex-col items-center">
                <p class="text-zinc-500 text-xs tracking-[0.3em] uppercase mb-6">2. Ingresa el PIN</p>
                <div class="flex items-center justify-center bg-zinc-950 border border-zinc-800/80 rounded-2xl shadow-inner w-full min-w-[320px] h-40">
                    <span id="pinDisplay" class="text-7xl font-light text-white tracking-[0.25em] ml-4">
                        ----
                    </span>
                </div>
                <p id="timeDisplay" class="text-sm text-zinc-400 mt-8 font-light tracking-widest border border-zinc-800 px-6 py-2 rounded-full bg-zinc-900/50">
                    HORARIO: --:-- A --:--
                </p>
            </div>
        </div>

        <!-- Mensajes de estado -->
        <p id="statusMessage" class="text-rose-400/80 mt-12 font-light text-sm h-6 tracking-wide"></p>
    </div>

    <script>
        function timeToMinutes(timeStr) {
            const parts = timeStr.split(':');
            return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
        }

        async function cargarPizarra() {
            try {
                const response = await fetch('pin.json');
                if (!response.ok) throw new Error("No se pudo cargar el archivo JSON");
                const pines = await response.json();

                const ahora = new Date();
                const año = ahora.getFullYear();
                const mes = String(ahora.getMonth() + 1).padStart(2, '0');
                const dia = String(ahora.getDate()).padStart(2, '0');
                const fechaHoy = `${año}-${mes}-${dia}`;
                
                const minutosActuales = ahora.getHours() * 60 + ahora.getMinutes();

                const clasesDeHoy = pines.filter(p => p.Fecha_Sesion === fechaHoy);

                if (clasesDeHoy.length === 0) {
                    document.getElementById('courseName').innerText = "SIN CLASES PROGRAMADAS HOY";
                    document.getElementById('statusMessage').innerText = `No hay registros para la fecha: ${fechaHoy}`;
                    return;
                }

                let claseActiva = clasesDeHoy.find(c => {
                    const inicio = timeToMinutes(c.Hora_Inicio) - 30; 
                    const fin = timeToMinutes(c.Hora_Fin);
                    return minutosActuales >= inicio && minutosActuales <= fin;
                });

                if (!claseActiva) {
                    claseActiva = clasesDeHoy[0];
                    document.getElementById('statusMessage').innerText = "FUERA DE HORARIO. MOSTRANDO PRÓXIMA SESIÓN.";
                } else {
                    document.getElementById('statusMessage').innerText = "";
                }

                if (claseActiva) {
                    document.getElementById('courseName').innerText = `GRUPO ${claseActiva.Grupo}`;
                    document.getElementById('pinDisplay').innerText = claseActiva.PIN;
                    
                    const inicioStr = claseActiva.Hora_Inicio.substring(0, 5);
                    const finStr = claseActiva.Hora_Fin.substring(0, 5);
                    document.getElementById('timeDisplay').innerText = `HORARIO: ${inicioStr} A ${finStr}`;
                }

            } catch (error) {
                console.error("Error al iniciar el tablero:", error);
                document.getElementById('courseName').innerText = "ERROR DEL SISTEMA";
                document.getElementById('statusMessage').innerText = "Verifica que el archivo pin.json esté en la misma ruta.";
            }
        }

        cargarPizarra();
        setInterval(cargarPizarra, 60000);
    </script>
</body>
</html>
